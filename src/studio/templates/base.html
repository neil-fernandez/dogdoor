<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <title>{% block title %}DogDoor Studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    try {
      const stored = localStorage.getItem("theme");
      const dark =
        stored === "dark" ||
        (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
</head>
<body>
  {% set path = request.url.path %}

  <header class="topbar">
    <a class="brand" href="/">DogDoor Studio</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="/datasets" class="{{ 'active' if path.startswith('/datasets') else '' }}">Datasets</a>
      <a href="/upload" class="{{ 'active' if path.startswith('/upload') else '' }}">Upload</a>
      <a href="/train" class="{{ 'active' if path.startswith('/train') else '' }}">Train</a>
      <a href="/predict" class="{{ 'active' if path.startswith('/predict') else '' }}">Predict</a>
      <a href="/experiments" class="{{ 'active' if path.startswith('/experiments') else '' }}">Experiments</a>
    </nav>
    <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle light and dark theme">
      <span class="icon-moon" aria-hidden="true">☾</span>
      <span class="icon-sun" aria-hidden="true">☀</span>
    </button>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <nav class="tabbar" aria-label="Primary">
    <a href="/datasets" class="tab {{ 'active' if path.startswith('/datasets') else '' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>Datasets</span>
    </a>
    <a href="/upload" class="tab {{ 'active' if path.startswith('/upload') else '' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Upload</span>
    </a>
    <a href="/train" class="tab {{ 'active' if path.startswith('/train') else '' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      <span>Train</span>
    </a>
    <a href="/predict" class="tab {{ 'active' if path.startswith('/predict') else '' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Predict</span>
    </a>
    <a href="/experiments" class="tab {{ 'active' if path.startswith('/experiments') else '' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      <span>Experiments</span>
    </a>
  </nav>

  <script>
    document.getElementById("theme-toggle")?.addEventListener("click", () => {
      const dark = document.documentElement.classList.toggle("dark");
      try {
        localStorage.setItem("theme", dark ? "dark" : "light");
      } catch (e) {}
    });
  </script>
</body>
</html>
