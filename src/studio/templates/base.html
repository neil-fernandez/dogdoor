<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <title>{% block title %}DogDoor Studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    try {
      const stored = localStorage.getItem("theme");
      const dark =
        stored === "dark" ||
        (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">DogDoor Studio</a>
    <nav id="nav-menu" class="nav-links" aria-label="Primary">
      <a href="/datasets">Datasets</a>
      <a href="/upload">Upload</a>
      <a href="/train">Train</a>
      <a href="/predict">Predict</a>
      <a href="/experiments">Experiments</a>
      <a href="/models">Models</a>
    </nav>
    <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle light and dark theme">
      <span class="icon-moon" aria-hidden="true">☾</span>
      <span class="icon-sun" aria-hidden="true">☀</span>
    </button>
    <button
      id="menu-toggle"
      type="button"
      class="icon-btn menu-toggle"
      aria-label="Menu"
      aria-expanded="false"
      aria-controls="nav-menu"
    >
      <span class="icon-open" aria-hidden="true">☰</span>
      <span class="icon-close" aria-hidden="true">✕</span>
    </button>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Theme toggle
    document.getElementById("theme-toggle")?.addEventListener("click", () => {
      const dark = document.documentElement.classList.toggle("dark");
      try {
        localStorage.setItem("theme", dark ? "dark" : "light");
      } catch (e) {}
    });

    // Burger menu
    const menuToggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-menu");
    const setMenu = (open) => {
      navLinks.classList.toggle("open", open);
      menuToggle.setAttribute("aria-expanded", String(open));
    };
    menuToggle?.addEventListener("click", () =>
      setMenu(!navLinks.classList.contains("open")),
    );
    navLinks?.addEventListener("click", (e) => {
      if (e.target.tagName === "A") setMenu(false);
    });
    window.addEventListener("resize", () => {
      if (window.innerWidth > 767) setMenu(false);
    });
  </script>
</body>
</html>
